[package]
name = "mihomo-tui"
version = "0.1.0"
edition = "2024"
description = "A cross-platform terminal UI for mihomo (Clash.Meta) proxy kernel"
license = "MIT"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP / WebSocket
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = "0.26"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
log = "0.4"
tui-logger = "0.14"

# Utils
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
bytesize = "1"
urlencoding = "2"

# Compression (for kernel downloads)
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true
