[package]
name = "mihomo-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
flate2 = "1.1.5"
futures-util = "0.3.32"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", default-features = false, features = ["charset", "json", "rustls", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }
urlencoding = "2.1.3"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
