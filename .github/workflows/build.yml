name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mihomo-tui
            package: mihomo-tui-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: mihomo-tui
            package: mihomo-tui-linux-aarch64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mihomo-tui.exe
            package: mihomo-tui-windows-x86_64.zip
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: mihomo-tui.exe
            package: mihomo-tui-windows-aarch64.zip
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: mihomo-tui
            package: mihomo-tui-macos-aarch64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }}
        shell: bash

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/mihomo-tui"
          python scripts/download_mihomo_core.py "${{ matrix.target }}" dist/package
          cp README.md dist/package/
          tar -czf "dist/${{ matrix.package }}" -C dist/package .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/mihomo-tui.exe"
          python scripts/download_mihomo_core.py "${{ matrix.target }}" dist/package
          Copy-Item README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.package }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error
