name: PR Pre-release

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Build preview ${{ matrix.name }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mihomo-tui
            package: mihomo-tui-linux-x86_64.tar.gz
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: mihomo-tui
            package: mihomo-tui-linux-aarch64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mihomo-tui.exe
            package: mihomo-tui-windows-x86_64.zip
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: mihomo-tui.exe
            package: mihomo-tui-windows-aarch64.zip
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: mihomo-tui
            package: mihomo-tui-macos-aarch64.tar.gz

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run CI checks before preview
        run: |
          cargo fmt --all -- --check
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
             # Skip clippy for cross-target on PR for speed, or just run native
             cargo clippy --all-targets --all-features --locked -- -D warnings
          else
             cargo clippy --all-targets --all-features --locked -- -D warnings
          fi
          cargo test --all-targets --all-features --locked
        shell: bash

      - name: Build release binary
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }}
        shell: bash

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/mihomo-tui"
          python scripts/download_mihomo_core.py "${{ matrix.target }}" dist/package
          cp README.md dist/package/
          tar -czf "dist/${{ matrix.package }}" -C dist/package .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/package/mihomo-tui.exe"
          python scripts/download_mihomo_core.py "${{ matrix.target }}" dist/package
          Copy-Item README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.package }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error

  prerelease:
    name: Publish rolling PR pre-release
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download preview artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Replace previous PR pre-release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pr-${PR_NUMBER}-${PR_SHA:0:7}"
          notes="Rolling preview build for ${PR_URL} at ${PR_SHA}."

          # Delete any previous release with the same tag if it exists (unlikely with SHA)
          gh release delete "${tag}" --yes --cleanup-tag || true
          git push origin ":refs/tags/${tag}" || true

          git tag -f "${tag}" "${PR_SHA}"
          git push origin "refs/tags/${tag}"

          mapfile -t assets < <(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          gh release create "${tag}" "${assets[@]}" \
            --prerelease \
            --title "PR #${PR_NUMBER} preview" \
            --notes "${notes}"
