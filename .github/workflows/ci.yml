name: CI / Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Lint & Check ────────────────────────────────────────────────
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: check
        run: cargo check --locked

  # ─── Build matrix (Linux x86_64, Linux aarch64, macOS, Windows) ─
  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mihomo-tui-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mihomo-tui-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mihomo-tui-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mihomo-tui-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mihomo-tui-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          strip mihomo-tui 2>/dev/null || true
          chmod +x mihomo-tui
          tar czf ${{ github.workspace }}/${{ matrix.artifact }}.tar.gz mihomo-tui

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path mihomo-tui.exe -DestinationPath "${{ github.workspace }}/${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ─── Release on tag ──────────────────────────────────────────────
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > ../checksums-sha256.txt 2>/dev/null || true
          cat ../checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## mihomo-tui ${{ github.ref_name }}

            A cross-platform terminal UI for mihomo (Clash.Meta) proxy kernel.

            ### Downloads
            - **Linux amd64**: `mihomo-tui-linux-amd64.tar.gz`
            - **Linux arm64**: `mihomo-tui-linux-arm64.tar.gz`
            - **macOS amd64**: `mihomo-tui-macos-amd64.tar.gz`
            - **macOS arm64**: `mihomo-tui-macos-arm64.tar.gz`
            - **Windows amd64**: `mihomo-tui-windows-amd64.exe.zip`

            See `checksums-sha256.txt` for SHA-256 verification.
          files: |
            artifacts/*
            checksums-sha256.txt
